# Video Game Asset Creator backend configuration.
# Paths are Windows paths on this machine; forward slashes also work.

instances:
  a:
    url: http://127.0.0.1:8188
    gpu: RTX 3060
    role: 3d
    # Normally run by ComfyUI Desktop (GameDevComfy). When nothing answers on 8188 and no copy is running, the
    # backend starts its own with this script; it only ever stops a copy it started itself.
    start_script: runtime/start-comfy-a.ps1
    start_timeout_seconds: 180
    # ComfyUI Desktop starts it without --port, so the CUDA device is what identifies it.
    process_match: "--cuda-device 1"
    external_owner: ComfyUI Desktop
    # ComfyUI Desktop picks its own port (it has used 8188 and 8189). When 8188 does not answer from the 3060, the
    # backend looks for the ComfyUI running on the 3060 on these ports and uses it for the session. It never takes
    # a ComfyUI running on the 3080 (instance b).
    discover: {gpu_match: "3060", ports: [8188, 8189, 8190, 8191, 8000]}
  b:
    url: http://127.0.0.1:8189
    gpu: RTX 3080
    role: images
    # Instance B's --output-directory (runtime/start-comfy-b.ps1). SkinToken writes its rigged
    # GLB there and reports the path as text, so the backend copies it from this folder.
    output_dir: F:/Projects/VideoGameAssetCreator/runtime/comfy-b-output
    # Started on demand by the backend when a step needs it (the desktop launcher uses the same script and match).
    start_script: runtime/start-comfy-b.ps1
    start_timeout_seconds: 180
    process_match: ComfyUI\main.py --port 8189
    # Only checks the card: a ComfyUI on 8189 that runs on the 3060 (ComfyUI Desktop taking the port) is reported as
    # a setup problem, and no 3080 work is sent to it.
    discover: {gpu_match: "3080", ports: []}

library_path: F:\Projects\VideoGameAssetCreator\library

blender_exe: F:/Tools/blender-5.2.3-windows-x64/blender.exe
unity_exe: C:/Program Files/Unity/Hub/Editor/6000.4.3f1/Editor/Unity.exe
unity_project: F:/Projects/VideoGameAssetCreator/unity-sandbox

# Shared ComfyUI input directory (both instances use it). LoadImage reads from here.
comfy_input_dir: C:/Projects/Comfy/input

# ComfyUI's loras folder. Your own add-ons are kept in its VGAC/mine/ folder; the app never lists anything else in it.
loras_dir: F:/Projects/ComfyUI/models/loras

# CC0 humanoid clip libraries, by id used in export params clips_library.
clips_libraries:
  ual1: "F:/Projects/VideoGameAssetCreator/data/animations/ual1/Animation Library[Standard]/Unity/AnimationLibrary_Unity_Standard.fbx"
  # Pack 2 (CC0, License.txt checked): Unreal mannequin bone names, mapped by blender/gait.py; "Add a move" offers it.
  ual2: "F:/Projects/VideoGameAssetCreator/data/animations/ual2/Universal Animation Library 2 [Standard]/Unity/UAL2_Standard.fbx"

# A job is not dispatched to any instance while free system RAM is below this.
min_free_ram_gb: 24

# Seconds a single ComfyUI job may take before the worker fails it.
job_timeout_seconds: 3600

# Optional (defaults shown): which instance runs each stage, the local judge's instance, and the time limit of a
# routine Blender step in seconds.
# stage_instances: {concept: b, turnaround: b, mesh: a, prep: host, rig: b, export: host}
# material_stage_instances: {concept: b, turnaround: b, mesh: b, prep: host, rig: host, export: host}
# judge_instance: b
# blender_timeout_seconds: 1800

# Optional (defaults shown): what each graphics card can take over when the card a step prefers is turned off in
# the app (Health page, "Graphics cards"; stored in <library_path>/prefs.json). Names are stages plus judge (the
# local picture judge) and material (every graphics-card step of the material category). prep and export run on
# the host and never need a card.
# Rig stays on b only: the SkinToken node finds Blender only through the SKINTOKEN_BLENDER_BIN environment
# variable, which runtime/start-comfy-b.ps1 sets for instance B. Instance A (Comfy Desktop) does not have it, so a
# rig job waits for b to be turned back on instead of moving.
# instance_capabilities:
#   a: [concept, turnaround, mesh, material, judge]
#   b: [concept, turnaround, mesh, rig, judge, material]
