# Video Game Asset Creator backend configuration.
# Paths are Windows paths on this machine; forward slashes also work.

instances:
  a:
    url: http://127.0.0.1:8188
    gpu: RTX 3060
    role: 3d
  b:
    url: http://127.0.0.1:8189
    gpu: RTX 3080
    role: images
    # Instance B's --output-directory (runtime/start-comfy-b.ps1). SkinToken writes its rigged
    # GLB there and reports the path as text, so the backend copies it from this folder.
    output_dir: F:/Projects/VideoGameAssetCreator/runtime/comfy-b-output

library_path: F:\Projects\VideoGameAssetCreator\library

blender_exe: F:/Tools/blender-5.2.3-windows-x64/blender.exe
unity_exe: C:/Program Files/Unity/Hub/Editor/6000.4.3f1/Editor/Unity.exe
unity_project: F:/Projects/VideoGameAssetCreator/unity-sandbox

# Shared ComfyUI input directory (both instances use it). LoadImage reads from here.
comfy_input_dir: C:/Projects/Comfy/input

# CC0 humanoid clip libraries, by id used in export params clips_library.
clips_libraries:
  ual1: "F:/Projects/VideoGameAssetCreator/data/animations/ual1/Animation Library[Standard]/Unity/AnimationLibrary_Unity_Standard.fbx"

# A job is not dispatched to any instance while free system RAM is below this.
min_free_ram_gb: 24

# Seconds a single ComfyUI job may take before the worker fails it.
job_timeout_seconds: 3600

# Optional (defaults shown): which instance runs each stage, the local judge's instance, and the time limit of a
# routine Blender step in seconds.
# stage_instances: {concept: b, turnaround: b, mesh: a, prep: host, rig: b, export: host}
# material_stage_instances: {concept: b, turnaround: b, mesh: b, prep: host, rig: host, export: host}
# judge_instance: b
# blender_timeout_seconds: 1800
