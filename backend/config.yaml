# Video Game Asset Creator backend settings: the defaults, true on any machine.
#
# This machine's own values (its ComfyUI install, graphics cards, Blender, Unity, folders) live in
# local/machine.json, which git ignores. Its "backend" section has the same keys as this file and is laid over it
# key by key (backend/vgac/config.py). Change this machine's settings there, not here.
#
# Relative paths are relative to the project folder. Forward slashes work everywhere.

instances:
  a:
    url: http://127.0.0.1:8188
    role: 3d
    # The backend starts this ComfyUI itself when a step needs it and nothing answers, if local/machine.json gives
    # it an `engine` (the ComfyUI folder, card and folders; see EngineConfig in config.py). It only ever stops a
    # copy it started.
    start_timeout_seconds: 180
  b:
    url: http://127.0.0.1:8189
    role: images
    # Instance B's --output-directory. SkinToken writes its rigged GLB there and reports the path as text, so the
    # backend copies it from this folder.
    output_dir: runtime/comfy-b-output
    start_timeout_seconds: 180

library_path: library

unity_project: unity-sandbox

# Set in local/machine.json: blender_exe, unity_exe, comfy_input_dir (the input folder every ComfyUI instance
# shares; LoadImage reads from it) and loras_dir (ComfyUI's loras folder; your own add-ons are kept in its
# VGAC/mine/ folder and the app never lists anything else in it).

# CC0 humanoid clip libraries, by id used in export params clips_library.
clips_libraries:
  ual1: "data/animations/ual1/Animation Library[Standard]/Unity/AnimationLibrary_Unity_Standard.fbx"
  # Pack 2 (CC0, License.txt checked): Unreal mannequin bone names, mapped by blender/gait.py; "Add a move" offers it.
  ual2: "data/animations/ual2/Universal Animation Library 2 [Standard]/Unity/UAL2_Standard.fbx"

# A job is not dispatched to any instance while free system RAM is below this.
min_free_ram_gb: 24

# Seconds a single ComfyUI job may take before the worker fails it.
job_timeout_seconds: 3600

# Optional (defaults shown): which instance runs each stage, the local judge's instance, and the time limit of a
# routine Blender step in seconds.
# stage_instances: {concept: b, turnaround: b, mesh: a, prep: host, rig: b, export: host}
# material_stage_instances: {concept: b, turnaround: b, mesh: b, prep: host, rig: host, export: host}
# judge_instance: b
# blender_timeout_seconds: 1800

# Optional (defaults shown): what each graphics card can take over when the card a step prefers is turned off in
# the app (Health page, "Graphics cards"; stored in <library_path>/prefs.json). Names are stages plus judge (the
# local picture judge) and material (every graphics-card step of the material category). prep and export run on
# the host and never need a card.
# Rig stays on b only: the SkinToken node finds Blender only through the SKINTOKEN_BLENDER_BIN environment
# variable. The backend sets it on every engine it starts itself, but a ComfyUI started by someone else (ComfyUI
# Desktop) may not have it, so a rig job waits for b to be turned back on instead of moving.
# instance_capabilities:
#   a: [concept, turnaround, mesh, material, judge]
#   b: [concept, turnaround, mesh, rig, judge, material]
