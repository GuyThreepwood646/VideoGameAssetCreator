# Models and tools the pipeline can use, with licence terms for the manifest.
#
# This file is the single source for the concept models (docs/CODE-AUDIT.md D1). An entry with `concept: true` is a
# concept painter: it is offered in the concept Adjust knob, the style lock and the creation form, and served by
# GET /api/models. Concept fields:
#   label          short name shown in the app
#   description    a few plain words on the look ("fast painted look")
#   default_steps  sampler steps when the version leaves steps empty
#   builder        graph builder function in vgac/graphs/concept.py
#   save_node      node id of the SaveImage that holds the final image in that graph
#   negative       true when the graph takes a real negative prompt (the style lock's negative is passed in)
# Add a concept model by adding an entry here plus its builder function; nothing else lists them.
models:
  zturbo: {name: Z-Image Turbo, file: z-image-turbo-fp8-aio.safetensors, licence: Apache-2.0, version: "1.0",
    concept: true, label: Z-Image Turbo, description: fast painted look, default_steps: 8, builder: zimage_graph, save_node: "8", negative: false}
  zbase: {name: Z-Image base, file: z_image_int8_convrot.safetensors, licence: Apache-2.0, version: "1.0",
    concept: true, label: Z-Image Base, description: "higher quality, slower", default_steps: 30, builder: zbase_graph, save_node: "9", negative: true}
  klein: {name: FLUX.2 Klein 4B, file: flux-2-klein-4b-fp8.safetensors, licence: Apache-2.0, version: "4B",
    concept: true, label: FLUX.2 Klein 4B, description: quick drafts, default_steps: 4, builder: klein_graph, save_node: "12", negative: false}
  anima: {name: Anima turbo, file: anima-turbo-v1.1.safetensors, licence: "Non-commercial model, outputs usable commercially", version: "1.1",
    concept: true, label: Anima Turbo, description: anime line art, default_steps: 10, builder: anima_graph, save_node: "9", negative: false}
  pixel: {name: Z-Image Turbo + pixel art LoRA, file: pixel_art_style_z_image_turbo.safetensors, licence: Apache-2.0, version: "1.0",
    concept: true, label: Z-Image Pixel Art, description: pixel art, default_steps: 8, builder: pixel_graph, save_node: "11", negative: false}
  chroma: {name: Chroma1-HD, file: Chroma1-HD-fp8mixed.safetensors, licence: Apache-2.0, version: "1.0",
    concept: true, label: Chroma1-HD, description: loose painterly, default_steps: 30, builder: chroma_graph, save_node: "9", negative: true}
  qwen_edit: {name: Qwen-Image-Edit-2511, file: qwen_image_edit_2511_fp8mixed.safetensors, licence: Apache-2.0, version: "2511"}
  qwen_angles_lora: {name: Qwen-Image-Edit-2511 multiple-angles LoRA, file: qwen-image-edit-2511-multiple-angles-lora.safetensors, licence: Apache-2.0, version: "1.0"}
  qwen_sheet_lora: {name: Qwen-Image-Edit-2511 character turnaround sheet LoRA (tarn59), file: qie2511_turnaround_sheet_tarn59.safetensors, licence: Apache-2.0, version: "1.0"}
  qwen_camera_lora: {name: Qwen-Image-Edit-2511 camera-angle LoRA (berkerdooo), file: qie2511_camera_angle_berkerdooo.safetensors, licence: Apache-2.0, version: "1.0"}
  qwen_lightning_lora: {name: Qwen-Image-Edit-2511 Lightning 4 steps, file: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors, licence: Apache-2.0, version: "1.0"}
  birefnet: {name: BiRefNet, file: birefnet.safetensors, licence: MIT, version: "1.0"}
  upscale_photo: {name: 4xRealWebPhoto v4 (DAT2), file: 4xRealWebPhoto_v4_dat2.pth, licence: CC-BY-4.0, version: "4"}
  upscale_art: {name: Real-ESRGAN x2plus, file: RealESRGAN_x2plus.pth, licence: BSD-3-Clause, version: "0.2.1"}
  trellis2: {name: TRELLIS.2, file: trellis_2_int8_convrot.safetensors, licence: MIT, version: "2"}
  hy3d_mv: {name: Hunyuan3D-2mv, file: Hunyuan3D-2mv.fp16.safetensors, licence: Tencent Hunyuan Community Licence, version: "2.0"}
  skintoken: {name: SkinToken, file: grpo_1400.ckpt, licence: MIT, version: grpo_1400}
  blender: {name: Blender, file: "", licence: GPL (tool), version: "5.2.3"}
  unity: {name: Unity Editor (sandbox import), file: "", licence: Unity Personal/Pro (tool), version: "6000.4.3f1"}
  ual1: {name: Universal Animation Library Standard (CC0), file: AnimationLibrary_Unity_Standard.fbx, licence: CC0, version: "1"}
  ual2: {name: Universal Animation Library 2 Standard (CC0), file: UAL2_Standard.fbx, licence: CC0, version: "1"}
  hair_library: {name: "VGAC hair library (Quaternius Universal Base Characters, MakeHuman hair, rule-built styles)", file: "", licence: CC0, version: "1"}
#
# Companions: files a graph loads next to the models above (text encoders, VAEs, the DINOv3 image encoder, the
# SkinToken skin VAE, the optional face model and the picture judge's text encoder). They are not concept painters or
# credit entries (credits.py reads only `models:`), but the setup check (preflight.py) looks for each one on the engine
# that runs the stage, and setup/downloads.json says where each comes from. `used_by` names the models that need it.
# A test (tests/test_model_list.py) fails when a graph names a model file that neither this file nor downloads.json lists.
companions:
  qwen_te: {name: Qwen 2.5 VL 7B text encoder (fp8 scaled), file: qwen_2.5_vl_7b_fp8_scaled.safetensors, licence: Apache-2.0, version: "2.5", used_by: [qwen_edit]}
  qwen_vae: {name: Qwen image VAE, file: qwen_image_vae.safetensors, licence: Apache-2.0, version: "1.0", used_by: [qwen_edit, anima]}
  trellis2_dino: {name: DINOv3 ViT-L image encoder (TRELLIS.2), file: dino_v3_vit_l.safetensors, licence: MIT, version: "1.0", used_by: [trellis2]}
  trellis2_shape_vae: {name: TRELLIS.2 shape VAE, file: trellis_2_shape_vae_bf16.safetensors, licence: MIT, version: "2", used_by: [trellis2]}
  trellis2_texture_vae: {name: TRELLIS.2 texture VAE, file: trellis_2_texture_vae_bf16.safetensors, licence: MIT, version: "2", used_by: [trellis2]}
  zimage_te: {name: Qwen 3 4B text encoder, file: qwen_3_4b.safetensors, licence: Apache-2.0, version: "3", used_by: [zbase, klein]}
  flux_ae: {name: FLUX autoencoder (ae), file: ae.safetensors, licence: Apache-2.0, version: "1.0", used_by: [zbase, chroma]}
  flux2_vae: {name: FLUX.2 VAE, file: flux2-vae.safetensors, licence: Apache-2.0, version: "2", used_by: [klein]}
  chroma_te: {name: T5-XXL text encoder (fp8 scaled), file: t5xxl_fp8_e4m3fn_scaled.safetensors, licence: Apache-2.0, version: "1.1", used_by: [chroma]}
  anima_te: {name: Qwen 3 0.6B base text encoder, file: qwen_3_06b_base.safetensors, licence: "Non-commercial model, outputs usable commercially", version: "3", used_by: [anima]}
  skintoken_vae: {name: SkinToken skin VAE, file: last.ckpt, licence: MIT, version: skin_vae_2_10_32768, used_by: [skintoken]}
  gemma3_12b: {name: Gemma 3 12B text encoder (picture judge), file: gemma_3_12B_it.safetensors, licence: Gemma Terms of Use, version: "3", used_by: [judge]}
  face_model: {name: MediaPipe face landmarker (ComfyUI route), file: mediapipe_face_fp32.safetensors, licence: Apache-2.0, version: "1.0", used_by: [lip points]}
  face_landmarker: {name: MediaPipe face landmarker (eyes and mouth, runtime/models), file: face_landmarker.task, licence: Apache-2.0, version: "1", used_by: [lip points]}
