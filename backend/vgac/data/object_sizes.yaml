# Common stand-alone objects and their usual real size, by name (F18: a described wheelbarrow came out 4.5 m long).
# Used only when a description names one of these objects and gives no size of its own, and only for the object
# categories listed below. Creatures, people and buildings never use this table.
#
# Per entry:
#   words     the names that match the object in a description (whole words, any case). Plurals are listed when
#             they should match too.
#   size_m    the usual size in metres
#   axis      which dimension the number is, the same axis names resolve_size uses:
#               height      the up extent
#               horizontal  the larger ground-plane extent ("across" or "long" on the ground)
#               longest     the largest of all three
#
# When a description names two entries, the one named first wins (the subject, in "a wheelbarrow full of apples").
# Entries close to their category default are left out, so nothing moves that does not need to.
version: 1
categories: [prop_rigid, prop_articulated, vehicle, foliage]
objects:
  wheelbarrow:
    words: [wheelbarrow, wheelbarrows]
    size_m: 1.5
    axis: longest
  gate:
    words: [gate, gates, garden gate, field gate]
    size_m: 1.0
    axis: horizontal
  door:
    words: [door, doors]
    size_m: 2.0
    axis: height
  barrel:
