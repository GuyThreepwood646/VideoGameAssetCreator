# Style presets. `model` picks the concept engine (docs/API.md style_lock.model values);
# `prompt_block` is appended to the asset prompt. The project style lock can override both.
# `delight_default` (G07): remove strips shadows and highlights painted into the colours in prep; keep leaves them,
# because painted shading is part of a stylised look (owner's decision: only the realistic style removes them).
# `pbr_fix_default` (G08): bring colours, metal and shine into physically based ranges in prep (realistic only;
# other styles are measured and reported).
#
# Recipes (reference.recipe): how the look carries through every step after the concept picture.
#   look         the style word in the recipe's plain sentence ("Low-poly character: ...")
#   plain        the rest of that sentence, in plain words
#   recipe       per-step settings; anything left out keeps today's behaviour (reference.RECIPE_DEFAULTS):
#     concept    {steps, negative}         steps empty: the model's own default
#     addons     [{id, strength}]          add-ons from data/addons.yaml, strength subtle | normal | strong
#     turnaround {lora_strength, prompt_suffix}
#     mesh       {triangle_scale, triangle_floor, texture_cap, normal_map}
#                triangle_scale times the platform budget, never under triangle_floor and never over the budget;
#                texture_cap is the largest texture size, under the platform's own
#     surface    {shading: smooth | flat, texture_filter: smooth | crisp, palette_colors: int or empty, pixel_snap}
#                pixel_snap: textures are shrunk by taking whole pixels (nearest neighbour), never blended
#     engine     {filter_mode: bilinear | point, mipmaps, compress}   what the Unity importer sets on the textures
#   by_category  {category id: {plain, recipe}} overrides for one kind of asset, merged over the style's own
styles:
  - id: painted
    delight_default: keep
    pbr_fix_default: false
    label: Painted
    model: zturbo
    look: Painted
    plain: smooth painted colours and full detail for your platform.
    prompt_block: >-
      A full-body painted concept art reference for a video game, a real digital painting with
      smooth painterly shading, clean readable shapes, slightly exaggerated proportions, muted
      colours with one bright accent.
    # Hair-friendly pictures (vgac/hairpic.py, docs/HAIR-RESEARCH.md 3.2 h): the clauses are joined into one sentence
    # after the style block, `head` for characters and `fur` for creatures (the category's `hair` key). A clause is
    # left out when the description asks for one of its `drop` wishes, and reworded by the first `swap` wish it asks
    # for (long_loose, short, fringe, over_eye, locs, wild, curly, styled, long_fur), so the description always wins.
    # `negative` is added for painters that take a negative prompt.
    # Tested 2026-11-05 (runtime/tmp/hairpics, round 2): "a few large, clearly separated clumps" made saw-tooth lock
    # ends in the 3D model and changed a cel character; a smooth simple shape kept the painted knight the same with a
    # tidier bob. Any hair words blew long loose hair out to the side, so long loose hair gets no sentence.
    hair:
      head:
        - text: hair as one smooth, simple shape with a clean outline and no loose strands
          drop: [long_loose, locs, curly, wild]
        - {text: both eyes clearly visible, drop: [long_loose, over_eye]}
      fur:
        - text: short dense fur lying flat in clear clumps
          swap: {long_fur: "long fur in a few thick, clearly separated clumps"}
        - the mane and tail as a few thick locks
      negative:
        head:
          - {text: "wispy hair, flyaway strands", drop: [wild, long_loose]}
          - {text: hair over the eyes, drop: [over_eye, long_loose]}
          - {text: transparent hair, drop: [long_loose]}
        fur: &fur_negative
          - "wispy fur, transparent fur"
          - {text: loose tufts, drop: [long_fur]}
  - id: cel
    delight_default: keep
    pbr_fix_default: false
    label: Cel shaded
    model: anima
    look: Cel-shaded
    plain: flat colour regions and two-tone shading, full detail for your platform.
    prompt_block: >-
      Anime cel-shaded style with flat colour regions, clean thin outlines, two-tone shading and
      simple readable shapes, suitable for a stylized video game character.
    # No hair sentence for characters: every wording tried changed the character on one of four pictures (a bob became
    # short spiky hair) or blew long hair out to the side (runtime/tmp/hairpics, round 2). Fur for creatures stays.
    hair: &hair_fur_only
      head: []
      fur:
        - text: short dense fur lying flat in clear clumps
          swap: {long_fur: "long fur in a few thick, clearly separated clumps"}
        - the mane and tail as a few thick locks
      negative:
        head: []
        fur: *fur_negative
  - id: pixel
    delight_default: keep
    pbr_fix_default: false
    label: Pixel art
    model: pixel
    look: Pixel-art
    plain: small crisp textures with a limited palette, chunky shapes, no smoothing.
    prompt_block: >-
      16-bit pixel art sprite style with a limited palette, crisp pixels and no anti-aliasing.
    # Plain looks want a plain shape (docs/HAIR-RESEARCH.md 5.2).
    hair: &hair_simple
      head: [hair as one simple solid shape]
      fur: [fur as one simple solid shape]
      negative:
        head: [{text: "wispy hair, flyaway strands", drop: [wild]}]
        fur: ["wispy fur"]
    recipe:
      mesh: {triangle_scale: 0.5, triangle_floor: 300, texture_cap: 256, normal_map: false}
      surface: {texture_filter: crisp, palette_colors: 32, pixel_snap: true}
      engine: {filter_mode: point, mipmaps: false, compress: false}
  - id: retro64
    delight_default: keep
    pbr_fix_default: false
    label: Retro 64
    model: zturbo
    look: Retro 64
    plain: chunky shapes with fewer triangles, small soft textures, no surface bumps.
    # Bake-off 6: starting with the medium stops the cube-headed voxel figures the old block gave.
    prompt_block: >-
      An in-game real-time 3D model from a late-1990s 64-bit home console game, a low-polygon mesh
      rendered in real time, not a drawing or illustration. Smooth gouraud vertex shading with soft
      glossy specular highlights, slightly angular silhouettes, chunky simplified hands and details,
      blurry low-resolution bilinear-filtered textures, bold saturated colours, bright ambient light
      with one warm key light from the upper left, a soft round blob shadow underneath, the whole image
      slightly soft like a low-resolution frame upscaled. Not built from cubes, no pixel art, no voxels.
    hair: *hair_simple
    recipe:
      mesh: {triangle_scale: 0.4, triangle_floor: 300, texture_cap: 256, normal_map: false}
  - id: lowpoly_flat
    delight_default: keep
    pbr_fix_default: false
    label: Low-poly flat
    model: zturbo
    look: Low-poly
    plain: faceted shapes with one flat colour per face, a quarter of the usual triangles, simple textures.
    # Bake-off 6: the old block stayed smooth; this one names the facets.
    prompt_block: >-
      A low-poly 3D model rendered in real time with flat shading, built from a few hundred large flat
      triangular facets, every facet one solid colour so each plane shows as a separate tone, sharp
      angular edges everywhere including the face, hair, cloth and wood, no textures and no smooth or
      rounded surfaces. Clean readable silhouette, soft pastel palette, simple soft ambient light.
      No pixel art, no voxels, no fine surface detail.
    hair: *hair_simple
    recipe:
      mesh: {triangle_scale: 0.25, triangle_floor: 300, texture_cap: 512, normal_map: false}
      surface: {shading: flat}
    by_category:
      material:
        plain: a simple flat-coloured tile with little texture detail.
  - id: realistic_pbr
    delight_default: remove
    pbr_fix_default: true
    label: Photoreal
    model: zbase
    look: Photoreal
    plain: the most detail your platform allows, lit evenly so it reacts to your game's lights, with real-world colours, metal and shine.
    # Shown with the recipe when the platform is not one of these: the look needs detail to read as real.
    recommend_platforms: [pc_mid, high]
    platform_note: Photoreal shows best on PC or Showcase; with Phone budgets it will look softer.
    prompt_block: >-
      A sharp studio product photograph taken for a 3D scanning reference, the real physical subject
      with true materials, fine surface detail, natural wear and accurate real-world proportions.
      Flat, even, shadowless lighting from a large soft light tent, with no cast shadows, no strong
      highlights and no coloured light. Everything in sharp focus from front to back. Neutral,
      unsaturated true-to-life colours.
    hair:
      head:
        - text: hair neatly tied back, braided or cut short and combed in clear locks
          swap:
            locs: hair in thick, clearly separated locks
            wild: hair in a few clear locks
            long_loose: hair combed in clear locks
            styled: hair combed in clear locks
            curly: hair neatly tied back or cut short, in clear, defined curls
            short: hair cut short and combed in clear locks
        - {text: no flyaway hairs, drop: [wild]}
        - text: nothing over the face
          drop: [over_eye]
          swap: {fringe: nothing over the eyes}
      fur:
        - text: short dense fur lying flat in clear clumps
          swap: {long_fur: "long fur in a few thick, clearly separated clumps"}
        - the mane and tail as a few thick locks
      negative:
        head:
          - {text: "wispy hair, flyaway strands", drop: [wild]}
          - {text: hair over the eyes, drop: [over_eye]}
          - {text: messy loose hair, drop: [long_loose, wild]}
          - transparent hair
          - {text: hair covering the collar, drop: [long_loose]}
        fur:
          - "wispy fur, transparent fur"
          - {text: loose tufts, drop: [long_fur]}
    recipe:
      concept:
        negative: >-
          painting, illustration, drawing, sketch, cartoon, anime, stylised, cel shading, 3D render,
          video game screenshot, hard shadows, cast shadow, dramatic lighting, rim light, coloured
          lighting, lens flare, depth of field, blurry background, motion blur, text, logo, watermark,
          softbox, light stand, umbrella light, studio equipment, lamp, tripod
      mesh:
        upsample: 1536
    # Honest notes per category: one generated shell with one painted skin cannot hold everything a photograph
    # shows. These are shown on the asset form under the recipe.
    by_category:
      humanoid:
        caveat: >-
          Photoreal people are the hardest case: eyes, teeth and hair are painted onto the surface
          rather than made separately, and hair becomes a solid shape, so faces look less real than
          armour, cloth and gear. Check the face in the side views before building the model.
      quadruped:
        caveat: >-
          Fur is painted onto a smooth surface rather than made of strands, and eyes are painted
          on, so it looks real at a distance and less so up close.
      winged:
        caveat: >-
          Feathers and wing membranes are painted onto a solid surface, so wings look thicker and
          less delicate than real ones.
      multileg:
        caveat: >-
          Fine hairs, thin legs and glossy eyes are painted on or thickened, so it reads best at a
          distance.
      serpent:
        caveat: >-
          Scales come out well; eyes and the inside of the mouth are painted on.
      prop_rigid:
        caveat: >-
          Glass, flames and anything that glows are painted as solid colour for now, and thin parts
          like chains or rope come out thick. Solid objects in wood, metal, stone and leather look best.
      prop_articulated:
        caveat: >-
          Glass and glowing parts are painted as solid colour for now. Solid objects in wood, metal,
          stone and leather look best.
      vehicle:
        caveat: >-
          Windows, lights and glossy paint are painted as solid colour for now, so vehicles look
          best from a distance.
      environment:
        caveat: >-
          Looks real at a few steps away; right up close the surface is softer than a photograph.
      foliage:
        caveat: >-
          Leaves are painted onto a solid shape rather than made one by one, so plants look best
          far away. This is the weakest category for Photoreal.
      material:
        caveat: >-
          Height and shine are worked out from the colours, so deep cracks and wet surfaces are
          approximate.
  - id: clay
    delight_default: keep
    pbr_fix_default: false
    label: Clay
    # Bake-off 6: Klein left the arms at the sides in every clay character; Z-Image Turbo keeps the pose.
    # Never add "puppet" or "figure" to the block: a second clay figure then appears beside the subject.
    model: zturbo
    look: Clay
    plain: soft sculpted shapes and matte colours, full detail for your platform.
    prompt_block: >-
      Clay animation, Clay. Stop-motion clay style, soft matte sculpted surfaces with fingerprint
      texture, rounded simplified shapes, warm muted colours, as if photographed on a tabletop set.
    # No hair sentence for characters: both wordings tried changed the knight's armour (round 2).
    hair: *hair_fur_only
