# Worn things that bend with the body stay part of it and are never listed (the help sentence names a few).
worn_words: [cloak, cape, scarf, belt, armour, armor, boots, boot, gloves, gauntlets, hood, robe, tunic, coat, jacket,
             dress, skirt, trousers, pants, shirt, vest, bracers, sash, mantle, shawl, poncho, apron]

# Words before an item word that mean the character does not have it ("without a sword", "no shield").
negations: ["no", "without", "not", "never", "unarmed"]

# A word after an item word that means it is not the item ("bow tie", "pack of wolves", "hat trick").
not_followed_by:
  bow: [tie, tied, legged, legs, ing]
  pack: [of, animal, leader]
  hat: [trick]
  club: [foot]
  cap: [sleeve, sleeves]
  hammer: [toe, toes]
  staff: [member, members]

# Categories whose descriptions are checked (characters and creatures). Everything else keeps its description as is.
categories: [humanoid, quadruped, multileg, winged, serpent]

# Added to the character's picture description when items are made separately.
empty_hands: >-
  The hands are open and empty, nothing is held in them, nothing is carried on the back and nothing hangs at the
  belt.
empty_hands_creature: >-
  Nothing is held in the mouth, nothing is carried on the back and nothing is worn on the head.

# How an item's own picture is painted, by view (replaces the rigid prop's pose block for a held item).
pose_blocks:
  upright: >-
    The {label} is shown alone, standing upright with its handle or grip at the bottom and its tip or head at the
    top, seen straight from the side so its whole length and shape are clear, the whole item visible with margin
    above and below, centred in frame. Plain flat light grey background. Soft even studio lighting with no hard
    shadows. No hands, no person, no stand, no wall mount, no other objects, no text, no motion blur, no cropping.
  front: >-
    The {label} is shown alone, upright, seen from a three-quarter front angle so its face and its thickness are both
    clear, the whole item visible with margin around it, centred in frame. Plain flat light grey background. Soft
    even studio lighting with no hard shadows. No hands, no person, no stand, no other objects, no text, no motion
    blur, no cropping.
  worn: >-
    The {label} is shown alone, upright as it would be worn, seen from a three-quarter front angle, the whole item
    visible with margin around it, centred in frame. Plain flat light grey background. Soft even studio lighting with
    no hard shadows. No person, no mannequin, no stand, no other objects, no text, no motion blur, no cropping.
