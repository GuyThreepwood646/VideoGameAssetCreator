    label: shield
    kind: shield
    size_m: 0.6
    socket: Socket_Forearm_L   # strapped to the outside of the off-hand forearm, face out, plane along the arm
    creature: null
    stow: Socket_Back
    rotation: [0, 0, 0]
    view: front
    clip_set: shield
  staff:
    words: [staff, staffs, staves, quarterstaff]
