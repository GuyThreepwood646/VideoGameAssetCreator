# Carried items: things a character or creature holds or carries that do not bend with the body. When a description
# names one, the character is made empty-handed and the item is made as its own asset (vgac/items.py), then attached
# to an attachment point (vgac/sockets.py). Served by GET /api/item-words. This is the one list; the asset form and
# the backend both read it from here.
#
# Per type:
#   words       the words that name it in a description (whole words, any case; longer phrases are matched first)
#   label       the plain name used in sentences and in the item's name ("Ranger - sword")
#   kind        how the grip is found on the item's mesh (vgac/grip.py):
#                 blade   a short handle, a guard and a long flat blade (sword, dagger)
#                 haft    a long handle with a head at one end (axe, mace, torch); held near the far end
#                 pole    a long shaft with no clear handle (staff, spear, wand); held at `grip_fraction` from the butt
#                 bow     held at the thickest slice near the middle
#                 shield  held at the middle of the back
#                 worn    carried, not held (quiver, backpack, bag); pivot at the middle of the side that touches the body
#                 head    worn on the head; pivot at the middle of the inner rim
#                 hang    hangs from the hand by a handle at the top (lantern)
#   size_m      the usual length along its longest side, written into the item's description ("about 0.9 m")
#   socket      where it goes by default (humanoid attachment points; a shield is strapped to the forearm,
#               Socket_Forearm_L, not held in the palm)
#   creature    where it goes on a creature (Socket_Head, Socket_Back, Socket_Mouth), or null when it does not suit one
#   stow        where it goes when put away (optional)
#   rotation    the default turn from the attachment point, in degrees about the point's own right, up and forward
#               axes (x, y, z), applied after the item's own grip frame (see vgac/grip.py for the frame)
#   view        how the item's own picture is painted: upright (standing up, seen from the side, handle at the
#               bottom), front (seen from the front, three-quarter) or worn (as it would be worn, three-quarter)
#   clip_set    the clip set a game would use with it (attachments.json; the library's attack is already a sword swing)
version: 1
types:
  sword:
    words: [sword, swords, short sword, shortsword, longsword, long sword, broadsword, greatsword, sabre, saber, katana, scimitar, rapier, cutlass, falchion]
    label: sword
    kind: blade
    size_m: 0.9
    socket: Socket_Hand_R
    creature: Socket_Mouth
    stow: Socket_Hip_L
    rotation: [0, 0, 0]
    view: upright
    clip_set: sword
  dagger:
    words: [dagger, daggers, knife, knives, dirk]
    label: dagger
    kind: blade
    size_m: 0.35
    socket: Socket_Hand_R
    creature: Socket_Mouth
    stow: Socket_Hip_R
    rotation: [0, 0, 0]
    view: upright
    clip_set: sword
  axe:
    words: [axe, axes, battleaxe, battle axe, hatchet, ax]
    label: axe
    kind: haft
    size_m: 0.7
    socket: Socket_Hand_R
    creature: null
    stow: Socket_Back
    rotation: [0, 0, 0]
    view: upright
    clip_set: sword
  mace:
    words: [mace, maces, warhammer, war hammer, hammer, club, flail, morningstar]
    label: mace
    kind: haft
    size_m: 0.7
    socket: Socket_Hand_R
    creature: null
    stow: Socket_Hip_L
    rotation: [0, 0, 0]
    view: upright
    clip_set: sword
  bow:
