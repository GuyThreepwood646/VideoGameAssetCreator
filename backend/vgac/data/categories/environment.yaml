id: environment
label: Environment piece
rig_engine: none
symmetric: false
size_m: 3.0
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: longest
size_word: across
size_label: "How big is it?"
size_hint: "In metres, along its longest side. A wall section is about 3 m wide; a floor tile about 2 m. Pieces are not rounded to a grid yet."
parts_default: []
topology: triangle
input_view_default: quarter
motion: none
clips: []
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The structure stands alone on a plain flat light grey ground against a plain flat light grey
  background, seen from a three-quarter front angle slightly above so its front, one side and top
  are visible, whole piece visible with margin around it, centred in frame. Soft even studio
  lighting with no hard shadows. No text, no logos, no people, no surrounding scenery, no motion
  blur, no cropping.
budgets:
  mobile_low: {triangles: 3000, texture: 1024}
  pc_mid: {triangles: 15000, texture: 2048}
  high: {triangles: 60000, texture: 4096}
