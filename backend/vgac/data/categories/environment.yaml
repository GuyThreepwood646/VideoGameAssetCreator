id: environment
label: Building or scenery piece
rig_engine: none
symmetric: false
# WP-47: pieces closer than this share of the subject's longer side are one subject (a crate by a wall, leaves of one plant).
subject_gap: 0.08
size_m: 3.0
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. For scenery this is only the starting size (the category size, or a size written in the
# description); the grid then rounds each side (G15), so environment has no size knob of its own.
size_axis: longest
size_word: across
size_label: "Size on the grid"
size_hint: "Rounded to whole grid squares; pick a footprint and a height below."
# G15 (docs/GREAT-ASSETS-PLAN.md 3.8): the grid step in metres (the prep knob grid_m overrides it per asset) and the
# pivot on the minimum corner (glTF and Unity: lowest X, lowest Z, on the ground).
grid_m: 1
pivot: corner
parts_default: []
topology: triangle
# The step 1 wording below asks for a level, square-on front (vgac/picture_view.py).
picture_view: front
# Placed first in the step 1 prompt, ahead of the description: the painter follows view words there and not at
# the end (vgac/stages/concept.py).
view_lead: "Straight-on front view, flat front elevation at eye level, camera directly in front, symmetrical, only the front wall visible:"
input_view_default: quarter
# The square-on step 1 picture against the 3D step's renders places a building's front by quarter turns
# (facing.by_picture): a box's outline cannot tell front from back, so the outline test never settles one.
facing_by_picture: true
motion: none
clips: []
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The structure stands alone on a plain flat light grey ground against a plain flat light grey
  background, seen straight from the front at eye level, square-on, with its front facing the camera,
  whole piece visible with margin around it, centred in frame. Soft even studio lighting with no hard
  shadows. No text, no logos, no people, no surrounding scenery, no motion blur, no cropping.
# WP-44 (standard detail pairs, bakeoff/wp44): with the rebuild off, all five pieces (cottage, arch, doorway, fence, sign)
# came out shattered (21 to 28 percent open edges). With the rebuild on they are whole and the doorway stays open.
remesh_default: true
# The 3D step builds at the platform's triangle and texture budget and the clean-up step reduces to the look's budget
# (Low-poly: 1,500 triangles, 512 px). The builder keeps thin parts (awnings, crates, window frames) at the larger size;
# its own reduction to 1,500 crumpled them.
build_at_platform_budget: true
budgets:
  mobile_low: {triangles: 3000, texture: 1024}
  pc_mid: {triangles: 15000, texture: 2048}
  high: {triangles: 60000, texture: 4096}
