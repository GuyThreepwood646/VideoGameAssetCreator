id: environment
label: Environment piece
rig_engine: none
symmetric: false
size_m: 3.0
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. For scenery this is only the starting size (the category size, or a size written in the
# description); the grid then rounds each side (G15), so environment has no size knob of its own.
size_axis: longest
size_word: across
size_label: "Size on the grid"
size_hint: "Rounded to whole grid squares; pick a footprint and a height below."
# G15 (docs/GREAT-ASSETS-PLAN.md 3.8): the grid step in metres (the prep knob grid_m overrides it per asset) and the
# pivot on the minimum corner (glTF and Unity: lowest X, lowest Z, on the ground).
grid_m: 1
pivot: corner
parts_default: []
topology: triangle
input_view_default: quarter
motion: none
clips: []
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The structure stands alone on a plain flat light grey ground against a plain flat light grey
  background, seen from a three-quarter front angle slightly above so its front, one side and top
  are visible, whole piece visible with margin around it, centred in frame. Soft even studio
  lighting with no hard shadows. No text, no logos, no people, no surrounding scenery, no motion
  blur, no cropping.
# Plan 3.4: no watertight remesh for scenery, so doorways and arches stay open.
remesh_default: false
budgets:
  mobile_low: {triangles: 3000, texture: 1024}
  pc_mid: {triangles: 15000, texture: 2048}
  high: {triangles: 60000, texture: 4096}
