id: quadruped
label: Quadruped
rig_engine: skintoken
silhouette_min: 0.5
symmetric: true
size_m: 1.5
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: horizontal
size_word: long
size_label: "How long is it?"
size_hint: "In metres, from the nose to the tip of the tail. A wolf is about 1.8 m; a horse about 3 m."
parts_default: []
topology: quad
input_view_default: quarter
# Hair-friendly pictures (vgac/hairpic.py): fur means the concept prompt gets the look's fur sentence, unless the
# description names scales, a robot or another animal without fur.
hair: fur
motion: legs
clips: [idle, walk, run, turn_left, turn_right, attack, hit, death]
lod_ratios: [0.5, 0.25, 0.1]
views: [front, left, back, right, quarter]
pose_block: >-
  The animal stands in a neutral four-legged standing pose, all four feet on the ground, head level
  and facing forward, seen from a three-quarter front angle so the face, chest and one flank are
  visible, whole body visible with margin around it, centred in frame. Plain flat light grey
  background. Soft even studio lighting from the front with no hard shadows. No text, no logos,
  no background scenery, no motion blur, no cropping.
budgets:
  mobile_low: {triangles: 5000, texture: 1024}
  pc_mid: {triangles: 20000, texture: 2048}
  high: {triangles: 60000, texture: 4096}
