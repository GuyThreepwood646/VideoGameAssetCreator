id: winged
label: Winged creature
rig_engine: skintoken
silhouette_min: 0.5
symmetric: true
size_m: 1.5
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: horizontal
size_word: across
size_label: "How wide are the wings?"
size_hint: "In metres, wing tip to wing tip. A hawk is about 1.2 m; a horse-sized dragon about 8 m."
parts_default: []
topology: quad
input_view_default: quarter
lod_ratios: [0.5, 0.25, 0.1]
views: [front, left, back, right, quarter]
pose_block: >-
  The creature stands on the ground in a neutral pose with both wings spread wide and flat to the
  sides so the whole wing shape is visible, head level and facing forward, seen from a three-quarter
  front angle, whole body visible with margin around it, centred in frame. Plain flat light grey
  background. Soft even studio lighting from the front with no hard shadows. No text, no logos,
  no background scenery, no motion blur, no cropping.
budgets:
  mobile_low: {triangles: 6000, texture: 1024}
  pc_mid: {triangles: 24000, texture: 2048}
  high: {triangles: 70000, texture: 4096}
