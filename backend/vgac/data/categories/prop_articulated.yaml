id: prop_articulated
label: Articulated prop
rig_engine: none
symmetric: false
size_m: 0.8
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: longest
size_word: across
size_label: "How big is it?"
size_hint: "In metres, along its longest side. A chest is about 0.9 m wide; a door about 2.1 m tall."
parts_default: [lid]
topology: triangle
input_view_default: front
motion: none
clips: []
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The object sits on a plain flat light grey surface against a plain flat light grey background
  with every moving part closed and in its rest position, seen from a three-quarter front angle
  slightly above, whole object visible with margin around it, centred in frame. Soft even studio
  lighting with no hard shadows. No text, no logos, no other objects, no scenery, no motion blur,
  no cropping.
budgets:
  mobile_low: {triangles: 1500, texture: 512}
  pc_mid: {triangles: 6000, texture: 2048}
  high: {triangles: 24000, texture: 4096}
