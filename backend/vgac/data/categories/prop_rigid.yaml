id: prop_rigid
label: Solid object
rig_engine: none
symmetric: false
size_m: 0.6
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: longest
size_word: across
size_label: "How big is it?"
size_hint: "In metres, along its longest side. A barrel is about 0.9 m tall."
parts_default: []
topology: triangle
# The step 1 wording below asks for a level, square-on front (vgac/picture_view.py).
picture_view: front
# Placed first in the step 1 prompt, ahead of the description: the painter follows view words there and not at
# the end (vgac/stages/concept.py).
view_lead: "Straight-on front view, flat front elevation at eye level, camera directly in front, symmetrical, only the front face visible:"
input_view_default: front
motion: none
clips: []
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The object sits on a plain flat light grey surface against a plain flat light grey background, seen
  straight from the front at eye level, square-on, with its front facing the camera, whole object
  visible with margin around it, centred in frame. Soft even studio lighting with no hard shadows. No
  text, no logos, no other objects, no scenery, no motion blur, no cropping.
budgets:
  mobile_low: {triangles: 1000, texture: 512}
  pc_mid: {triangles: 5000, texture: 2048}
  high: {triangles: 20000, texture: 4096}
