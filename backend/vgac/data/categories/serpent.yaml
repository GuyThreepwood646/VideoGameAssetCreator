id: serpent
label: Snake or fish
rig_engine: skintoken
silhouette_min: 0.45
symmetric: true
size_m: 2.0
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: longest
size_word: long
size_label: "How long is it?"
size_hint: "In metres, head to tail as it lies. A python is about 4 m."
parts_default: []
topology: quad
# The step 1 wording below asks for a level, square-on front (vgac/picture_view.py).
picture_view: front
# Z-Image Turbo ignores view words at the end of the prompt (step1-view trial 2026-11-22: 0 of 8 square-on); put
# first, before the description, they gave 8 of 8 (vgac/stages/concept.py, view_lead).
view_lead: "Straight-on front view at eye level, camera directly in front of the animal, its head toward the camera:"
input_view_default: quarter
# Hair-friendly pictures (vgac/hairpic.py): the look's fur sentence only when the description names fur or a mane.
hair: fur_if_named
motion: wave
clips: [idle, slither, turn_left, turn_right, attack, hit, death]
lod_ratios: [0.5, 0.25, 0.1]
views: [front, left, back, right, quarter]
pose_block: >-
  The creature is shown in a straight neutral pose with the body extended in a gentle S curve along
  one line, no coils or loops, head raised slightly and facing the camera, seen straight from the
  front at eye level, square-on, so the head and the curve of the body behind it are visible, whole
  body visible with margin around it, centred in frame. Plain flat light grey background. Soft even
  studio lighting from the front with no hard shadows. No text, no logos, no background scenery, no
  motion blur, no cropping.
budgets:
  mobile_low: {triangles: 4000, texture: 1024}
  pc_mid: {triangles: 16000, texture: 2048}
  high: {triangles: 50000, texture: 4096}
