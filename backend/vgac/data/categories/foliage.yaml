id: foliage
label: Foliage
rig_engine: none
silhouette_min: 0.45
symmetric: false
size_m: 2.5
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: height
size_word: tall
size_label: "How tall is it?"
size_hint: "In metres, from the ground to the top. A bush is about 1 m; an oak about 15 m."
parts_default: []
topology: triangle
input_view_default: front
lod_ratios: [0.5, 0.25]
views: [front, left, back, right, quarter]
pose_block: >-
  The plant stands alone with its base on a plain flat light grey ground against a plain flat light
  grey background, seen straight from the front at eye level, whole plant from the base to the top
  visible with margin around it, centred in frame, leaves and branches clearly separated from the
  background. Soft even studio lighting with no hard shadows. No text, no logos, no other plants,
  no scenery, no motion blur, no cropping.
budgets:
  mobile_low: {triangles: 1500, texture: 1024}
  pc_mid: {triangles: 8000, texture: 2048}
  high: {triangles: 30000, texture: 4096}
