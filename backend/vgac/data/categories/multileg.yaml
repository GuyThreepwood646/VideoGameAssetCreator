id: multileg
label: Multi-leg creature
rig_engine: skintoken
silhouette_min: 0.5
symmetric: true
size_m: 1.0
# Size along this axis (G12): height is the up extent, horizontal the larger ground-plane extent, longest the
# largest of all three. size_word is the axis word in sentences; size_label and size_hint label the prep knob.
size_axis: horizontal
size_word: across
size_label: "How wide is it?"
size_hint: "In metres, across the legs. A large spider is about 0.2 m; a giant cave spider about 2 m."
parts_default: []
topology: quad
input_view_default: quarter
# Hair-friendly pictures (vgac/hairpic.py): the look's fur sentence only when the description names fur or a mane.
hair: fur_if_named
motion: legs
clips: [idle, walk, run, turn_left, turn_right, attack, hit, death]
lod_ratios: [0.5, 0.25, 0.1]
views: [front, left, back, right, quarter]
pose_block: >-
  The creature stands in a neutral pose with all legs planted on the ground and spread evenly so
  every leg is visible and none overlap, body level, head facing forward, seen from a three-quarter
  front angle slightly above, whole body visible with margin around it, centred in frame. Plain flat
  light grey background. Soft even studio lighting from the front with no hard shadows. No text,
  no logos, no background scenery, no motion blur, no cropping.
budgets:
  mobile_low: {triangles: 6000, texture: 1024}
  pc_mid: {triangles: 24000, texture: 2048}
  high: {triangles: 70000, texture: 4096}
