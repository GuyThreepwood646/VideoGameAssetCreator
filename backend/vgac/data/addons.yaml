# LoRAs (called add-ons in the code): small trained files a concept model or the turnaround loads on top of its model.
#
# This file is the one list of add-ons the app knows. The app never lists a models folder: an add-on exists for the
# app only when it is named here. Add one by adding an entry; nothing else lists them.
#
# Fields:
#   id               short id used in recipes, the project style lock (`loras`) and the concept `addons` knob
#   label            plain name shown in the app
#   help             {meaning, why, technical}, the same three lines every other term has
#   file             path under ComfyUI's loras folder, forward slashes (the graph turns them into the Windows form)
#   base_models      model ids (data/models.yaml) the add-on works with; it is applied only when the chosen model is one
#   stage            concept or turnaround
#   trigger          words appended to the prompt when the add-on is applied (optional)
#   strengths        {subtle, normal, strong}: the strength each step loads the add-on at
#   default_strength one of subtle, normal, strong
#   required         true when the step cannot run without it (shown locked, cannot be switched off)
#   built_in         model ids whose graph already loads this add-on (data/models.yaml builder); for those the
#                    strength is passed to the graph instead of adding a second loader, and no trigger is appended
#   required_for     model ids for which the LoRA is part of the model itself (shown locked for those)
#   licence, source  recorded in the export manifest
addons:
  - id: pixel_art
    label: Pixel-art LoRA
    help:
      meaning: Pushes the image model toward crisp 16-bit pixel art with a small palette.
      why: Gives the blocky, hand-placed pixel look; the Z-Image Pixel Art model is built on it.
      technical: Z-Image Turbo pixel art style LoRA, model only, trigger "Pixel art style."
    file: ZImage/pixel_art_style_z_image_turbo.safetensors
    base_models: [zturbo, pixel]
    stage: concept
    trigger: Pixel art style.
    strengths: {subtle: 0.6, normal: 1.0, strong: 1.2}
    default_strength: normal
    built_in: [pixel]
    required_for: [pixel]
    licence: Apache-2.0
    source: models.yaml entry "pixel" (Z-Image Turbo + pixel art LoRA)
  - id: qwen_lightning
    label: Lightning LoRA (fast turnaround)
    help:
      meaning: Lets the side-view model (Qwen-Image-Edit) finish each side view in 4 quick passes instead of 40.
      why: The turnaround takes seconds per view instead of minutes. It is part of the turnaround and cannot be switched off.
      technical: Qwen-Image-Edit-2511 Lightning 4-step LoRA at strength 1.0
    file: Qwen/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    base_models: [qwen_edit]
    stage: turnaround
    strengths: {subtle: 1.0, normal: 1.0, strong: 1.0}
    default_strength: normal
    required: true
    licence: Apache-2.0
    source: models.yaml entry "qwen_lightning_lora"
  - id: qwen_angles
    label: Multiple-angles LoRA (camera angles)
    help:
      meaning: Teaches the side-view model (Qwen-Image-Edit) to turn the camera around your asset for the side and back views.
      why: Without it the views do not turn. Subtle keeps more of the original look; strong turns more reliably. It is part of the turnaround and cannot be switched off.
      technical: Qwen-Image-Edit-2511 multiple-angles LoRA (lora_strength)
    file: Qwen/qwen-image-edit-2511-multiple-angles-lora.safetensors
    base_models: [qwen_edit]
    stage: turnaround
    strengths: {subtle: 0.75, normal: 0.9, strong: 1.05}
    default_strength: normal
    required: true
    licence: Apache-2.0
    source: models.yaml entry "qwen_angles_lora"
  # Optional looks from the add-on bake-off (docs/RECIPES-BAKEOFF.md). None is a recipe default: each is offered
  # for the models in base_models and switched on by the person.
  - id: stylised_3d
    label: Stylised 3D look
    help:
      meaning: Makes the picture look like a rendered stylised 3D game character or prop.
      why: Gives one consistent toy-like 3D look. It darkens the backdrop a little and can pull arms closer to the body, so use normal or subtle.
      technical: Z-Image Turbo 3DRenderStyle Redmond LoRA, model only, trigger "3D Render Style. 3DRenderAF." Bake-off docs/RECIPES-BAKEOFF.md 4.1.
    file: VGAC/zit_3drender_redmond.safetensors
    base_models: [zturbo]
    stage: concept
    trigger: 3D Render Style. 3DRenderAF.
    strengths: {subtle: 0.5, normal: 0.7, strong: 1.0}
    default_strength: normal
    licence: Apache-2.0
    source: https://huggingface.co/artificialguybr/3DRenderStyle-REDMOND-ZIMAGE
  - id: clay_finish
    label: Hand-made clay finish
    help:
      meaning: Makes clay pictures look more matte and hand-sculpted.
      why: The Clay style already looks like clay; this adds a stronger plasticine finish. Strong loses small details.
      technical: Z-Image Turbo ClayAnimation Redmond LoRA, model only, trigger "Clay animation, Clay." Bake-off 4.2.
    file: VGAC/zit_clay_redmond.safetensors
    base_models: [zturbo]
    stage: concept
    trigger: Clay animation, Clay.
    strengths: {subtle: 0.4, normal: 0.6, strong: 0.8}
    default_strength: normal
    licence: Apache-2.0
    source: https://huggingface.co/artificialguybr/ClayAnimation-Redmond-ZIMAGE
  - id: retro_lowpoly
    label: Late-90s low-poly look
    help:
      meaning: Pushes the picture toward a late-1990s low-polygon game model with small blurry textures.
      why: The best retro look found, and it keeps the backdrop plain. Strong starts to change outfits.
      technical: Z-Image Turbo PS1Graphics Redmond LoRA, model only. Its trigger names a console but drew no lettering in 18 tests. Bake-off 4.3.
    file: VGAC/zit_ps1_redmond.safetensors
    base_models: [zturbo]
    stage: concept
    trigger: Playstation 1 Graphics. PS1 Game.
    strengths: {subtle: 0.4, normal: 0.6, strong: 0.8}
    default_strength: normal
    licence: Apache-2.0
    source: https://huggingface.co/artificialguybr/PS1Graphics-Redmond-ZimageTURBO
  - id: chunky_pixels
    label: Chunky pixel sprites
    help:
      meaning: Bigger, blockier pixels with a smaller palette than the standard pixel-art look.
      why: Looks most like an old sprite on creatures and props. On people it can change the outfit, so the standard pixel look stays the default for characters.
      technical: Z-Image Turbo PixelArt Redmond LoRA, trigger "Pixel Art, PixArFK". Offered for the plain Z-Image Turbo model only; the Z-Image Pixel Art model keeps its built-in LoRA (the two are never stacked). Bake-off 4.4.
    file: VGAC/zit_pixelart_redmond.safetensors
    base_models: [zturbo]
    stage: concept
    trigger: Pixel Art, PixArFK
    strengths: {subtle: 0.7, normal: 1.0, strong: 1.2}
    default_strength: normal
    licence: Apache-2.0
    source: https://huggingface.co/artificialguybr/PIXELART-REDMOND-ZIMAGETURBO
