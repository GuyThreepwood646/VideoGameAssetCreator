# Runs the project's tests on every pull request to master and on every push to master.
# Nothing here needs a graphics card, ComfyUI, Blender or Unity: the backend tests use stand-ins and skip the few
# that need a real Blender or a downloaded file. No secrets are used. Pull requests from forks run with read-only
# access because this uses `pull_request`, never `pull_request_target`.
name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same pull request (or branch) cancels the run that is still going.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This job is skipped in two cases. A pull request from the owner's own work (branch named claude/ or RTF_/, opened
  # by GuyThreepwood646) is skipped, and so is a push to master. The orchestrator runs the full backend suite locally
  # with real Blender before every merge, and every change reaches master through a pull request. A skipped job
  # reports as skipped, which GitHub treats as passing for required checks. Other people's pull requests still run it.
  backend:
    name: Backend tests (Windows)
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'RTF_/')) && github.event.pull_request.user.login == 'GuyThreepwood646')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the Python packages
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        # The checkout path is too deep for a test library under bakeoff/t, so test libraries go in the runner's
        # short temporary folder (tests/conftest.py, VGAC_TEST_LIBRARY_ROOT).
        env:
          VGAC_TEST_LIBRARY_ROOT: ${{ runner.temp }}\vgac-t
        run: python -m pytest -q -rs tests -p no:cacheprovider --junitxml=pytest-report.xml
      # Skips are for things a runner legitimately lacks (Blender, the animation packs, the stored test pictures,
      # this machine's own settings file): 28 skip on a clean checkout, plus up to 4 more that only a runner shows.
      # More than 32 means something that should be here is missing, so the job fails.
      # Fewer than 1900 passed means tests were not collected.
      - name: Check the passed, failed and skipped counts
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/check_pytest_counts.py pytest-report.xml --max-skipped 32 --min-passed 1900

  frontend:
    name: Frontend type check, build and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` is `tsc -b && vite build`: the type check, then the build.
      - run: npm run build
      - run: npm test

  starter:
    name: Starter build and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uses the C# compiler that ships with Windows. The first command compiles the whole starter, the second
      # compiles and runs its tests and fails on any failed check.
      - name: Build the starter
        run: starter\build.cmd
      - name: Run the starter's tests
        run: starter\build.cmd test

  launcher:
    name: Launcher tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # These two test files need no installed packages, so there is no npm install (and no Electron download).
      - run: node desktop/appbridge.test.js
      - run: node desktop/machine.test.js
      - run: node desktop/movegate.test.js
